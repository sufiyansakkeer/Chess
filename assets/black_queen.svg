<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 45 45" width="45" height="45">
  <defs>
    <!-- Premium black gradient with subtle blue tint -->
    <linearGradient id="blackTribalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#303035" />
      <stop offset="40%" stop-color="#252530" />
      <stop offset="70%" stop-color="#1a1a25" />
      <stop offset="100%" stop-color="#101020" />
    </linearGradient>
    
    <!-- Enhanced shadow filter for dramatic 3D effect -->
    <filter id="tribalShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5" />
      <feOffset dx="1" dy="2" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.6" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Glow effect for highlights -->
    <filter id="tribalGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite operator="over" in="SourceGraphic" />
    </filter>
  </defs>
  
  <!-- Main queen shape with tribal-inspired design -->
  <g filter="url(#tribalShadow)">
    <!-- Base of the queen with tribal pattern -->
    <path d="M12 37h21v-4l-2,-2h-17l-2,2z"
          fill="url(#blackTribalGradient)" stroke="#aaa" stroke-width="1.2" stroke-linejoin="round" />
    
    <!-- Decorative base pattern -->
    <path d="M14 34l2,-1h13l2,1"
          fill="none" stroke="#aaa" stroke-width="0.7" stroke-opacity="0.5" />
    
    <!-- Middle section with tribal curves -->
    <path d="M16 31c0,0 0,-5 0,-5c0,-2 3,-4 6.5,-4c3.5,0 6.5,2 6.5,4c0,0 0,5 0,5z"
          fill="url(#blackTribalGradient)" stroke="#aaa" stroke-width="1.2" stroke-linejoin="round" />
    
    <!-- Tribal pattern on middle section -->
    <path d="M18 29c0,-3 0,-3 0,-3c0,0 2,-2 4.5,-2c2.5,0 4.5,2 4.5,2c0,0 0,0 0,3"
          fill="none" stroke="#aaa" stroke-width="0.7" stroke-opacity="0.5" />
    
    <!-- Crown with tribal flame styling -->
    <path d="M16 26c0,0 0,-2 0,-2
             c0,-1 -1,-1 -2,-1
             c-1,0 -2,1 -3,0
             c-1,-1 0,-3 0,-3
             l5,-8
             l6.5,9
             l6.5,-9
             l5,8
             c0,0 1,2 0,3
             c-1,1 -2,0 -3,0
             c-1,0 -2,0 -2,1
             c0,0 0,2 0,2
             h-13z"
          fill="url(#blackTribalGradient)" stroke="#aaa" stroke-width="1.2" stroke-linejoin="round" />
    
    <!-- Tribal details on crown -->
    <path d="M19 24c0,0 0,-1 -1,-1
             c-1,0 -1.5,0.5 -2,0
             c-0.5,-0.5 0,-1.5 0,-1.5
             l3,-5
             l3.5,5
             l3.5,-5
             l3,5
             c0,0 0.5,1 0,1.5
             c-0.5,0.5 -1,0 -2,0
             c-1,0 -1,1 -1,1"
          fill="none" stroke="#aaa" stroke-width="0.7" stroke-opacity="0.5" />
  </g>
  
  <!-- Highlights for enhanced 3D effect -->
  <g filter="url(#tribalGlow)">
    <!-- Highlight on base -->
    <path d="M15 33l1.5,-0.5h12l1.5,0.5" 
          stroke="white" stroke-width="0.6" stroke-opacity="0.15" stroke-linecap="round" fill="none" />
    
    <!-- Vertical highlights on middle section -->
    <path d="M19 28c0,-2 0,-2 0,-2 M26 28c0,-2 0,-2 0,-2" 
          stroke="white" stroke-width="0.5" stroke-opacity="0.12" stroke-linecap="round" fill="none" />
    
    <!-- Highlights on crown -->
    <path d="M22.5 12l-6.5 9 M22.5 12l6.5 9" 
          stroke="white" stroke-width="0.6" stroke-opacity="0.15" stroke-linecap="round" fill="none" />
  </g>
</svg>
