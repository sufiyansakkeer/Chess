<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 45 45" width="45" height="45">
  <defs>
    <!-- Premium white gradient with subtle blue tint -->
    <linearGradient id="whiteTribalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f8f8ff" />
      <stop offset="70%" stop-color="#f0f0fa" />
      <stop offset="100%" stop-color="#e8e8f0" />
    </linearGradient>
    
    <!-- Accent gradient for decorative elements -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d0d0e0" />
      <stop offset="50%" stop-color="#f0f0ff" />
      <stop offset="100%" stop-color="#d0d0e0" />
    </linearGradient>
    
    <!-- Enhanced shadow filter for dramatic 3D effect -->
    <filter id="tribalShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.8" />
      <feOffset dx="1.2" dy="2.5" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.6" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Glow effect for highlights -->
    <filter id="tribalGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite operator="over" in="SourceGraphic" />
    </filter>
  </defs>
  
  <!-- Main rook shape with tribal-inspired design -->
  <g filter="url(#tribalShadow)">
    <!-- Base of the rook with tribal pattern -->
    <path d="M10 37h25v-5l-3,-2h-19l-3,2z"
          fill="url(#whiteTribalGradient)" stroke="#000" stroke-width="1.2" stroke-linejoin="round" />
    
    <!-- Decorative base pattern -->
    <path d="M12 34l3,-2h15l3,2"
          fill="none" stroke="#000" stroke-width="0.8" stroke-linejoin="round" />
    
    <!-- Middle section with tribal curves -->
    <path d="M14 30c0,0 0,-10 0,-10c0,0 -1,-2 4,-2h9c5,0 4,2 4,2c0,0 0,10 0,10z"
          fill="url(#whiteTribalGradient)" stroke="#000" stroke-width="1.2" stroke-linejoin="round" />
    
    <!-- Tribal pattern on middle section -->
    <path d="M16 28c0,-8 0,-8 0,-8c0,0 0,-1 2,-1h9c2,0 2,1 2,1c0,0 0,0 0,8"
          fill="none" stroke="#000" stroke-width="0.7" stroke-opacity="0.5" />
    
    <!-- Decorative middle band -->
    <path d="M14 24h17 M14 20h17"
          stroke="url(#accentGradient)" stroke-width="0.8" stroke-linecap="round" fill="none" />
    
    <!-- Top crown section with flame-like design -->
    <path d="M14 18c0,0 1,-1 3,-1h11c2,0 3,1 3,1v1h-17z"
          fill="url(#whiteTribalGradient)" stroke="#000" stroke-width="1.2" stroke-linejoin="round" />
    
    <!-- Flame-like crown elements inspired by the reference image -->
    <path d="M16 18v-7c0,0 0.5,-1 1.5,-1s2,1 2,2c0,1 0,4 0,6"
          fill="url(#whiteTribalGradient)" stroke="#000" stroke-width="1" stroke-linejoin="round" />
          
    <path d="M20 18v-8c0,0 0.5,-1.5 2.5,-1.5s2.5,1.5 2.5,2.5c0,1 0,5 0,7"
          fill="url(#whiteTribalGradient)" stroke="#000" stroke-width="1" stroke-linejoin="round" />
          
    <path d="M26 18v-7c0,0 0.5,-1 1.5,-1s2,1 2,2c0,1 0,4 0,6"
          fill="url(#whiteTribalGradient)" stroke="#000" stroke-width="1" stroke-linejoin="round" />
    
    <!-- Inner flame details -->
    <path d="M17.5 17v-5c0,0 0.2,-0.5 0.7,-0.5s1,0.5 1,1c0,0.5 0,3 0,4.5"
          fill="none" stroke="#000" stroke-width="0.5" stroke-opacity="0.3" />
          
    <path d="M21.5 17v-6c0,0 0.2,-0.7 1.2,-0.7s1.2,0.7 1.2,1.2c0,0.5 0,3.5 0,5.5"
          fill="none" stroke="#000" stroke-width="0.5" stroke-opacity="0.3" />
          
    <path d="M27.5 17v-5c0,0 0.2,-0.5 0.7,-0.5s1,0.5 1,1c0,0.5 0,3 0,4.5"
          fill="none" stroke="#000" stroke-width="0.5" stroke-opacity="0.3" />
  </g>
  
  <!-- Highlights for enhanced 3D effect -->
  <g filter="url(#tribalGlow)">
    <!-- Highlight on base -->
    <path d="M13 33l2,-1h15l2,1" 
          stroke="white" stroke-width="0.7" stroke-opacity="0.6" stroke-linecap="round" fill="none" />
    
    <!-- Vertical highlights on middle section -->
    <path d="M17 28c0,-7 0,-7 0,-7 M28 28c0,-7 0,-7 0,-7" 
          stroke="white" stroke-width="0.6" stroke-opacity="0.5" stroke-linecap="round" fill="none" />
    
    <!-- Highlights on flame crown -->
    <path d="M17.5 15c0,0 0.5,-1 1,-1 M22.5 14c0,0 0.5,-1 1,-1 M27.5 15c0,0 0.5,-1 1,-1" 
          stroke="white" stroke-width="0.5" stroke-opacity="0.7" stroke-linecap="round" fill="none" />
  </g>
</svg>
